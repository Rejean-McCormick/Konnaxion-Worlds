name: PostgreSQL integration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postgres-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres:
    name: PostgreSQL isolation tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: konnaxion_worlds
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d konnaxion_worlds"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DJANGO_SETTINGS_MODULE: worlds_config.settings
      PYTHONPATH: backend
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/konnaxion_worlds

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-worlds.txt
            backend/pyproject.toml

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-worlds.txt pytest pytest-django

      - name: Run full test suite against PostgreSQL
        run: python -m pytest -q
