world_contract: kx-world-pack/v1

world_key: cuny-political-philosophy
title: CUNY Political Philosophy
description: >
  Demonstration World containing independent political-philosophy discussion
  threads and sourced reconstructed positions.

pack_version: 1.3.0

requires:
  ethikos_scenario_schema: ethikos-demo-scenario/v3
  fixtures:
    - isced-f

scenarios:
  - key: political-philosophy
    path: scenarios/political-philosophy.json

persona_policy:
  internal_username: "w_{world_token}__{actor_key}"
  real_person_representation: reconstructed_position

derived_data:
  smart_vote:
    build_readings: true
  search:
    build_index: true

metadata:
  owner: demo
  tags:
    - philosophy
    - democracy
    - cuny
