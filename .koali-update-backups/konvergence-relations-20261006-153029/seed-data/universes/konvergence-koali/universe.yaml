- world_key: member-jeremie
  seed_pack_key: member-jeremie
  seed_version: 1.0.0
  title: World personnel — Jérémie
  description: 'Espace de création : performance, symboles, vidéo, danse, provocation éthique et mobilisation.'
  visibility: private
- world_key: member-aida
  seed_pack_key: member-aida
  seed_version: 1.0.0
  title: World personnel — Aïda
  description: Espace d’éthique, droit, gouvernance, consentement, limites et anti-capture.
