universe_contract: kx-universe-pack/v1
universe_key: konvergence-koali
title: Konvergence Koali — kOA Genesis Universe
description: Univers de simulation où cinq protagonistes et leurs alliés font converger expertise, art, finance,
  éthique, éducation et technologie à travers des Worlds autonomes; Konnaxion compose la connaissance et les coalitions,
  Orgo coordonne l’exécution.
pack_version: 1.0.0
visibility: private
default_world: uckk
requires:
  world_contract: kx-world-pack/v1
  host_contracts:
  - kx-world-personas/v1
  external_authorities:
  - kristal_v5_runtime_pack
worlds:
- world_key: desjardins
  seed_pack_key: desjardins
  seed_version: 1.0.0
  title: Desjardins — Finance coopérative
  description: Simulation de réforme coopérative, financement des communs et agrégation démocratique des capacités
    financières.
  visibility: private
- world_key: kristal-farms
  seed_pack_key: kristal-farms
  seed_version: 1.0.0
  title: Kristal Farms — Infrastructure et communautés
  description: World de simulation pour infrastructure locale, énergie, calcul, chaleur utile, communautés et gouvernance
    territoriale.
  visibility: private
- world_key: tech-development
  seed_pack_key: tech-development
  seed_version: 1.0.0
  title: Développement technologique — kOA/Koali/Konnaxion
  description: 'Atelier technique du kOA Digital Ecosystem : Worlds, Universes, réplication, réconciliation, interfaces
    et mécanismes abstraits.'
  visibility: private
- world_key: amusement-kreative
  seed_pack_key: amusement-kreative
  seed_version: 1.0.0
  title: Amusement / Kreative — Art, jeu et mythologie
  description: 'World artistique : danse, musique, performances, humour, mythologie King Klown et expériences de
    résonance.'
  visibility: private
- world_key: orgo-internal-ops
  seed_pack_key: orgo-internal-ops
  seed_version: 1.0.0
  title: Orgo — Coordination logistique interne
  description: 'World de coordination quotidienne : signaux, cas, tâches, propriétaires, dépendances, délais, escalade,
    clôture et mémoire opérationnelle.'
  visibility: private
- world_key: orgo-events
  seed_pack_key: orgo-events
  seed_version: 1.0.0
  title: Orgo — Coordination des événements
  description: Planification et exécution de spectacles, consultations, conférences, mobilisations et exercices
    publics.
  visibility: private
- world_key: uckk
  seed_pack_key: uckk
  seed_version: 1.0.0
  title: UCKK — Univers-Cité King Klown
  description: 'Institution de transmission : apprendre à lire les systèmes, les mécanismes, les preuves, les symboles
    et les limites du pouvoir.'
  visibility: private
- world_key: media-network
  seed_pack_key: media-network
  seed_version: 1.0.0
  title: Réseau de plateformes — Visite guidée des traces
  description: 'World de médiation entre publications distribuées et récit interne : plateformes publiques, réactions,
    provenance et parcours guidés.'
  visibility: private
- world_key: member-thomas-antoine
  seed_pack_key: member-thomas-antoine
  seed_version: 1.0.0
  title: World personnel — Thomas / Antoine
  description: Espace de travail finance, stratégie institutionnelle et démocratie coopérative. L’ambiguïté Thomas/Antoine
    est conservée comme question éditoriale du manuscrit.
  visibility: private
- world_key: member-simon
